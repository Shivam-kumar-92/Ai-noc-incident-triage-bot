name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax & bytecode check
        run: python -m compileall -q triage_engine triage_bot.py tests

      - name: Run unit & integration tests
        run: python -m unittest discover -s tests -v

      - name: End-to-end AI-NOC demo triage & postmortem export
        run: python triage_bot.py --demo --offline --export-md tmp_demo_out --json-out tmp_demo_out/rcas.json
